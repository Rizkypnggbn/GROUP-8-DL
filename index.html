html{scroll-padding-top:env(safe-area-inset-top,0px)}

.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer}

.res{margin-left:6px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
.note{font-size:.82rem;color:var(--mut);margin-top:18px}
label{display:block;margin:4px 0}
</style>
</head>

const SK=["Listening","Reading","Writing","Speaking"];
let c=0,s=0;const $=i=>document.getElementById(i);
const nz=t=>t.toLowerCase().replace(/['‘]/g,"’").replace(/\s+/g," ").trim();
const EM=["💌","🏷️","🏠","⏰","📏"],CL=["#d6336c","#0c8599","#e8590c","#3b5bdb","#2f9e44"],SE=["🎧","📖","✍️","🗣️"];
let mute=false,AC,cur;
function beep(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const f={tap:[600],ok:[660,880,1100],bad:[300,220],show:[520]}[k]||[600];f.forEach((hz,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.11;o.frequency.value=hz;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.16)})}catch(e){}}
function msg(t){const e=$("toast");e.textContent=t;e.className="on";clearTimeout(msg.t);msg.t=setTimeout(()=>e.className="",4500)}
let VO=[];function lv(){VO=window.speechSynthesis?speechSynthesis.getVoices():[]}

function say(t){
 if(!window.speechSynthesis){msg("This browser cannot play voice. Open the page in Chrome or Safari, or press Show script and read it aloud.");return}
 speechSynthesis.cancel();speechSynthesis.resume();lv();
 const v=VO.find(x=>/en[-_]US/i.test(x.lang)&&/google|samantha|zira|aria|natural/i.test(x.name))||VO.find(x=>/^en/i.test(x.lang));
 (t.match(/[^.!?]+[.!?]*/g)||[t]).forEach(p=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang="en-US";u.rate=.85;if(v)u.voice=v;speechSynthesis.speak(u)});
 setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)msg("No voice was produced. Turn the phone volume up and install a text-to-speech voice (on Android: Google Speech Services), then try again.")},1800);
}
function sp(b){const t=b.dataset.t,f=b.dataset.f;beep("tap");if(cur)cur.pause();let used=false;const go=()=>{if(!used){used=true;say(t)}};
 if(f){const a=new Audio(f);cur=a;a.onerror=go;a.play().catch(go)}else say(t)}

function chk(b){const i=b.previousElementSibling,ok=i.dataset.a.split("|").some(a=>nz(a)===nz(i.value));const r=b.nextElementSibling;r.className="res "+(ok?"ok":"bad");r.textContent=ok?"✓ Correct 🎉":"✗ Answer: "+i.dataset.a.split("|")[0];beep(ok?"ok":"bad");const cd=b.closest(".card"),n=cd.querySelectorAll("input[data-a]").length,g=cd.querySelectorAll(".res.ok").length;cd.querySelector(".prog i").style.width=g/n*100+"%";cd.querySelector(".sc").textContent=g+" / "+n+" correct"+(g===n?" — perfect! 🌟":"")}
